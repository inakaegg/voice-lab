name = "voice-lab"
main = "cloudflare/src/index.ts"
compatibility_date = "2025-06-27"

assets = { directory = "./src/mo_speech/web", binding = "ASSETS", run_worker_first = true, html_handling = "none" }

[[kv_namespaces]]
binding = "MO_SPEECH_KV"
id = "8eeb96d03f7e4d97ad387a654225b649"

[[d1_databases]]
binding = "MO_SPEECH_DB"
database_name = "mo-speech-demo-db"
database_id = "3e526561-0c28-42f9-8ff2-e84d091d0d70"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MO_SPEECH_AUDIO_R2"
bucket_name = "mo-speech-audio"
preview_bucket_name = "mo-speech-audio-preview"

# 共通課金基盤（credit-base）の内部API。RPCなのでbinding宣言そのものが認可になり、
# shared secretを配らずに済む。HTTP経路はローカル開発とテスト用で、.dev.varsにだけ置く。
[[services]]
binding = "CREDIT_BASE"
service = "credit-base"
entrypoint = "CreditBase"

[vars]
PUBLIC_CANONICAL_ORIGIN = "https://voice-lab.inakaegg.workers.dev"
RUNPOD_API_BASE_URL = "https://api.runpod.ai/v2"
RUNPOD_RUNTIME_HEALTH_CHECK = "1"
RUNPOD_WARMUP_PRELOAD_VOICE_CONVERSION = "1"
OPENAI_TRANSLATION_MODEL = "gpt-5.6-terra"
OPENAI_TEXT_DISPLAY_MODEL = "gpt-5.6-terra"
OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
OPENAI_TTS_VOICE = "coral"
OPENAI_TTS_RESPONSE_FORMAT = "wav"
SEED_VC_DIFFUSION_STEPS = "8"
SEED_VC_REFERENCE_MAX_SECONDS = "12"
ZOOVOICE_ENABLED = "1"
ZOOVOICE_ORIGIN_MODE = "cloud-run"
ZOOVOICE_CLOUD_RUN_URL = "https://zoovoice-kx3ku4k2fa-uc.a.run.app"
ZOOVOICE_TURNSTILE_SITE_KEY = "0x4AAAAAAEGEa8LeZO8poIN_"
ZOOVOICE_TURNSTILE_EXPECTED_HOSTNAME = "voice-lab.inakaegg.workers.dev"
# 無料枠を超えた利用者のクレジット消費。未設定が既定のOFFで、現行のquotaのみ運用へ戻せる
CREDIT_CONSUME_ENABLED = "0"
# GPU実費の換算。voice-conversion-jobsの想定（120秒で予約額30）から 30/120。実測後に見直す
CREDIT_RUNPOD_CREDITS_PER_SECOND = "0.25"
CREDIT_SYNC_RESERVE_TTL_SECONDS = "600"
CREDIT_JOB_RESERVE_TTL_SECONDS = "600"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["17 3 * * *"]
