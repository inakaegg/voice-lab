# 用語辞書（textlint-rule-prh用）
# レビューで実際に指摘された「読者に伝わらない語」を登録する。
# 同型の指摘が2件以上出た語はここへ追加して機械検査化する（共通AGENTS.md §7）。
version: 1
rules:
  # 未定着の漢語への言い換え（英語の直訳調）。定着したカタカナ語・平易な言い換えを使う。
  - expected: フォールバック
    pattern: 縮退
    prh: fallbackの直訳。読者に伝わらない
  - expected: 起動
    pattern: 起床
    prh: wakeの直訳。プロセスやエージェントには「起動」「再開」を使う
