name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/zoovoice/go.mod
          cache-dependency-path: services/zoovoice/go.mod

      - name: Install Python dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Python tests
        run: python3 -m pytest

      - name: Zoovoice Go checks
        working-directory: services/zoovoice
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Build the Zoovoice service stage
        run: docker build --target service-builder --file services/zoovoice/Dockerfile --tag zoovoice-service:ci .

      - name: Worker and browser tests
        run: npm test

      - name: Worker typecheck and dry-run bundle
        run: npm run check:worker

      - name: React typecheck and production build
        run: npm run check:web

      - name: Committed frontend build artifacts are fresh
        run: |
          stale=0
          # 追跡済みファイルの内容差分。
          git diff --exit-code -- src/mo_speech/web/react || stale=1
          # 生成物の増減(untracked/削除)は git diff では見えないため status も併用する。
          if [ -n "$(git status --porcelain -- src/mo_speech/web/react)" ]; then
            git status --porcelain -- src/mo_speech/web/react
            stale=1
          fi
          if [ "$stale" -ne 0 ]; then
            echo "::error::commit済みのフロントエンド生成物がlockfileとずれています。ローカルで npm run check:web を実行し、src/mo_speech/web/react の差分をcommitしてください。"
            exit 1
          fi

      - name: Build wheel and verify bundled web assets
        run: |
          python3 -m pip wheel . --no-deps --wheel-dir tmp/wheel
          python3 scripts/verify_wheel_assets.py tmp/wheel

      - name: JavaScript syntax checks
        run: npm run check:js

      - name: RunPod Dockerfile is covered by the repository checks
        run: test -f Dockerfile.runpod && test -f .github/workflows/runpod-image.yml

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: |
          python3 -m pip install -e .
          npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Responsive UI layout tests
        run: >-
          npx playwright test
          --project "${{ matrix.browser }}-desktop"
          --project "${{ matrix.browser }}-intermediate"
          --project "${{ matrix.browser }}-mobile"

      - name: Zoovoice portal tests
        if: matrix.browser == 'chromium'
        run: npm run test:e2e:portal-zoovoice

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-failure-${{ matrix.browser }}
          path: tmp/playwright/
          if-no-files-found: ignore
          retention-days: 7

  ui-e2e-required:
    name: ui-e2e
    needs: ui-e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every browser E2E job
        env:
          UI_E2E_RESULT: ${{ needs.ui-e2e.result }}
        run: test "$UI_E2E_RESULT" = "success"
