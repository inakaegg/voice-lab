<text x="24" y="536" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic Medium',sans-serif" font-size="14" fill="#6f7684" font-weight="normal" text-anchor="start">同じ認識単位の列が、段階を経て実際の発話位置と重なっていく。位置は模式値で、実測の一例は前後比較の図を参照。</text>
