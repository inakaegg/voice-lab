<text x="530" y="340" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic Medium',sans-serif" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">終了 = 単位9の終了時刻(時刻表から)</text>
<line x1="710" y1="250" x2="710" y2="202" stroke="#0e7a55" stroke-width="2" stroke-linecap="round"/>
<polygon points="710,202 705,211 715,211" fill="#0e7a55"/>
<text x="24" y="414" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic Medium',sans-serif" font-size="14" fill="#6f7684" font-weight="normal" text-anchor="start">時刻や文字列をLLMに書き写させると、1か所の写し間違いで比較全体が失敗する。写し得る情報を番号だけに絞っている。</text>
