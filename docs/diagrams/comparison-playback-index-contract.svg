<text x="80" y="312" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic Medium',sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">フレーズ2 = 単位5〜9</text>
<text x="80" y="340" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic Medium',sans-serif" font-size="13.5" fill="#6f7684" font-weight="normal" text-anchor="start">ほかに到達状態・点数・コメント</text>
<line x1="260" y1="250" x2="260" y2="236" stroke="#3b52c4" stroke-width="2" stroke-linecap="round"/>
